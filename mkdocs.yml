site_name: xDSL
site_url: https://xdsl.dev
site_description: xDSL -- a Python-native compiler framework
site_author: xDSL developers
copyright: Copyright &copy xDSL developers
repo_name:  xdslproject/xdsl
repo_url: https://github.com/xdslproject/xdsl

strict: true

theme:
  name: "material"
  variant: classic
  logo: assets/img/logos/xdsl-transparent-single.png
  favicon: assets/img/logos/xdsl-transparent-single.png
  locale: en
  features:
    - content.code.annotate
    - content.code.copy
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: xdsl
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode

markdown_extensions:
  - attr_list
  - admonition
  - footnotes
  - md_in_html
  - meta
  - sane_lists
  - smarty
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.saneheaders
  - pymdownx.superfences
  - pymdownx.tilde

extra_css:
  - stylesheets/extra.css

plugins:
- search
- awesome-nav
- blog:
    blog_dir: blog
    blog_toc: true
- redirects:
    # GitHub Pages serves HTML redirects, not HTTP 301/308 responses.
    # Keep the previously published URLs, including archives and pagination.
    redirect_maps:
      news/index.md: blog/index.md
      news/2021/08/10/project-kicks-off.md: blog/posts/blog/2021-08-10-kickoff-meeting.md
      news/2021/09/14/dsl-keynote-at-iwomp.md: blog/posts/blog/2021-09-14-iwomp-keynote.md
      news/2021/11/10/bof-at-sc21.md: blog/posts/blog/2021-11-10-bof-sc21.md
      news/2021/11/20/phd-opportunity.md: blog/posts/blog/2021-11-20-phd-advert.md
      news/2021/12/13/position-available-on-xdsl-project.md: blog/posts/blog/2021-12-13-hiring-postdoc.md
      news/2022/06/12/irdl-paper-presented-at-pldi-conference.md: blog/posts/blog/2022-06-12-irdl-pldi.md
      news/2022/06/24/dsl-pasc-mini-symposium.md: blog/posts/blog/2022-06-24-pasc.md
      news/2022/07/12/xdsl-at-the-excalibur-workshop.md: blog/posts/blog/2022-07-12-excalibur.md
      news/2023/01/16/new-year-new-hackathon.md: blog/posts/blog/2023-01-16-hackathon.md
      news/2023/02/25/eth-zurich-presentation.md: blog/posts/blog/2023-02-25-eth.md
      news/2023/05/09/mlir-hackathon-and-workshop.md: blog/posts/blog/2023-05-09-mlir-workshop.md
      news/2023/05/18/xdsl-at-durham-hpc-days.md: blog/posts/blog/2023-05-18-durham-excalibur.md
      news/2023/05/21/xdsl-at-isc-2023.md: blog/posts/blog/2023-05-21-isc.md
      news/2025/01/13/xdsl-at-hipeac-2025.md: blog/posts/blog/2025-01-13-hipeac-announcement.md
      news/archive/2021.md: blog/archive/2021.md
      news/archive/2022.md: blog/archive/2022.md
      news/archive/2023.md: blog/archive/2023.md
      news/archive/2025.md: blog/archive/2025.md
      news/page/2.md: blog/page/2/index.md
- rss:
    match_path: (events|blog/posts)/.*
    date_from_meta:
      as_creation: date
    categories:
      - categories
      - tags
    feeds_filenames:
      rss_created: feed.xml
      rss_updated: feed-updated.xml

extra:
  social:
    - icon: material/book-open-variant
      link: https://docs.xdsl.dev/
      name: xDSL documentation
    - icon: material/rss
      link: /feed.xml
      name: Subscribe to our RSS Feed
    - icon: material/chat
      link: https://xdsl.zulipchat.com/
      name: Chat on Zulip
    - icon: material/github
      link: https://github.com/xdslproject
      name: Contribute on Github
